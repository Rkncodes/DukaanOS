[project]
name = "dukaanos-backend"
version = "0.1.0"
description = "DukaanOS backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.0",
    "pillow>=11",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
parchi = [
    "rapidocr-onnxruntime>=1.3",
]
vision = [
    "rapidocr-onnxruntime>=1.3",
    "torch>=2.4",
    "transformers>=4.45",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette.testclient suggests httpx2; httpx still works fine for tests
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
